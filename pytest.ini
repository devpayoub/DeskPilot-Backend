[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
# packages/toolcore and services are on the path so tests run without a
# pip install -e of either.
pythonpath = . packages/toolcore services
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:cacheprovider
    --reuse-db
markers =
    eval: golden-set evaluation cases (replayed from cassettes in CI)
testpaths = tests
filterwarnings =
    ignore::RuntimeWarning:django.db.backends.utils
    ignore::ResourceWarning
    ignore::DeprecationWarning:pkg_resources.*
