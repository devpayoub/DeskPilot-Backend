# DeskPilot — M0 skeleton
#
# Ports are deliberately offset from the defaults so this stack can run
# alongside other local projects: api 8010, postgres 5433, redis 6380.
#
# The Django service is called "api", not "web": the Next.js console lives in
# ../web and runs outside this compose file during development.
#
# This file sits inside backend/, so the build context is this directory.

name: deskpilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: deskpilot
      POSTGRES_USER: deskpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskpilot -d deskpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://deskpilot:${POSTGRES_PASSWORD:-deskpilot}@db:5432/deskpilot
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    volumes:
      - .:/app
      - ./packages:/packages
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://deskpilot:${POSTGRES_PASSWORD:-deskpilot}@db:5432/deskpilot
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,worker
    volumes:
      - .:/app
      - ./packages:/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
